name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit/ -v

  dashboard:
    # The public site (dashboard/) is a real deployed artifact, so it gets
    # the same gate as the Python side. Kept as its own job rather than
    # steps on lint-and-test: a Node failure should read as a Node failure,
    # not bury a Python result.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22.x is what this app is developed and verified against locally,
          # and matches Vercel's current default runtime. Next 16 only needs
          # >=20.9, but shipping the version actually tested beats shipping
          # one that merely satisfies the engine field.
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  ci-eval:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    environment: eval
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download FinanceBench dataset
        run: python scripts/download_financebench.py

      - name: Run 30-question CI eval
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          # Embeddings, ragas judging, and the Bedrock-throttle fallback all
          # route through OpenAI -- the eval cannot run without this.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python evals/run_ci_eval.py

      - name: Post eval scores as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/results/ci_latest.json';
            if (!fs.existsSync(path)) {
              console.log('No results file found');
              return;
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const fmt = (v) => v != null ? v.toFixed(3) : 'N/A';
            const body = [
              '## CI Eval Results',
              `| Metric | Score |`,
              `|--------|-------|`,
              `| faithfulness | ${fmt(r.faithfulness)} |`,
              `| answer_relevancy | ${fmt(r.answer_relevancy)} |`,
              `| context_precision | ${fmt(r.context_precision)} |`,
              `| context_recall | ${fmt(r.context_recall)} |`,
              `| numerical_accuracy | ${fmt(r.numerical_accuracy)} |`,
              `| n_questions | ${r.n_questions} |`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
